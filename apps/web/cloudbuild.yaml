# NEXT_PUBLIC_* is inlined into the client bundle at build time, so the api's
# URL and the Firebase web config are build args — setting them on the Cloud Run
# service does nothing. The api must therefore be deployed before this runs.
#   gcloud builds submit --config apps/web/cloudbuild.yaml --substitutions \
#     _TAG=$(git rev-parse --short HEAD),_API_URL=https://...,_FB_API_KEY=...
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      ['build', '--target', 'runner', '-f', 'apps/web/Dockerfile',
       '--build-arg', 'NEXT_PUBLIC_API_URL=${_API_URL}',
       '--build-arg', 'NEXT_PUBLIC_FIREBASE_API_KEY=${_FB_API_KEY}',
       '--build-arg', 'NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_FB_AUTH_DOMAIN}',
       '--build-arg', 'NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_FB_PROJECT_ID}',
       '-t', '${_IMAGE}:${_TAG}', '-t', '${_IMAGE}:latest', '.']
images:
  - '${_IMAGE}:${_TAG}'
  - '${_IMAGE}:latest'
substitutions:
  _IMAGE: asia-southeast1-docker.pkg.dev/peace-buddy-staging/peace-buddy/web
  _TAG: latest
  _API_URL: ''
  _FB_API_KEY: ''
  _FB_AUTH_DOMAIN: ''
  _FB_PROJECT_ID: ''
timeout: 1800s
