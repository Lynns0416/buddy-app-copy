# Built on Cloud Build rather than locally: Cloud Run needs linux/amd64 and the
# dev machines are arm64. Invoked from the repo root, e.g.
#   gcloud builds submit --config apps/api/cloudbuild.yaml \
#     --substitutions _TAG=$(git rev-parse --short HEAD)
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      ['build', '--target', 'runner', '-f', 'apps/api/Dockerfile',
       '-t', '${_IMAGE}:${_TAG}', '-t', '${_IMAGE}:latest', '.']
images:
  - '${_IMAGE}:${_TAG}'
  - '${_IMAGE}:latest'
substitutions:
  _IMAGE: asia-southeast1-docker.pkg.dev/peace-buddy-staging/peace-buddy/api
  _TAG: latest
timeout: 1800s
