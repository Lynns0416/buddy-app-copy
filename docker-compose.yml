services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: peacebuddy
      POSTGRES_PASSWORD: peacebuddy
      POSTGRES_DB: peacebuddy
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peacebuddy"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Buddy photos. The api makes the same Blob SDK calls here as against Azure,
  # signing links with Azurite's well-known development key instead of a
  # managed identity. --skipApiVersionCheck lets an SDK newer than this image
  # talk to it.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    command: azurite-blob --blobHost 0.0.0.0 --location /data --skipApiVersionCheck
    ports:
      - "10000:10000"
    volumes:
      - azurite_data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    ports:
      - "8080:8080"
    env_file:
      - apps/api/.env
    environment:
      DATABASE_URL: postgresql://peacebuddy:peacebuddy@db:5432/peacebuddy
      # Azurite's published development account; the key is public by design.
      STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
      STORAGE_PHOTOS_CONTAINER: photos
      # The api reaches Azurite as `azurite`, the browser as `localhost`.
      STORAGE_LINK_BASE_URL: http://localhost:10000/devstoreaccount1
      # Keep pnpm's store off the host bind mount — it defaults to
      # /app/.pnpm-store there and grows without bound inside the repo.
      npm_config_store_dir: /app/node_modules/.pnpm-store
      # The node_modules volume is seeded from the image, which was built with a
      # different store dir, so the first install wants to purge it and aborts
      # with no TTY to confirm on. CI mode lets it purge without asking.
      CI: "true"
    depends_on:
      db:
        condition: service_healthy
      azurite:
        condition: service_started
    volumes:
      - .:/app
      # Named, not anonymous: `up --build` recreates containers, and every
      # recreate orphans a fresh set of anonymous volumes.
      - api_nm_root:/app/node_modules
      - api_nm_types:/app/packages/types/node_modules
      - api_nm_api:/app/apps/api/node_modules

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    ports:
      - "3000:3000"
    env_file:
      - apps/web/.env.local
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_APPLE_SIGN_IN_ENABLED: "${NEXT_PUBLIC_APPLE_SIGN_IN_ENABLED:-false}"
      npm_config_store_dir: /app/node_modules/.pnpm-store
      CI: "true"
    depends_on:
      - api
    volumes:
      - .:/app
      - web_nm_root:/app/node_modules
      - web_nm_web:/app/apps/web/node_modules
      - web_next:/app/apps/web/.next

  ci:
    profiles: [ci]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev  # reuse any image that has all deps
    environment:
      CI: "true"
      npm_config_store_dir: /app/node_modules/.pnpm-store
    entrypoint: []
    command: sh -c "
      cd /app && pnpm install --frozen-lockfile &&
      pnpm exec prisma generate --schema /app/prisma/schema.prisma &&
      cd /app/packages/types && pnpm build &&
      cd /app/apps/api && pnpm lint && pnpm typecheck && pnpm test &&
      cd /app/apps/web && pnpm lint && pnpm typecheck && pnpm test
      "
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - ci_nm_root:/app/node_modules
      - ci_nm_types:/app/packages/types/node_modules
      - ci_nm_api:/app/apps/api/node_modules
      - ci_nm_web:/app/apps/web/node_modules

volumes:
  db_data:
  azurite_data:
  api_nm_root:
  api_nm_types:
  api_nm_api:
  web_nm_root:
  web_nm_web:
  web_next:
  ci_nm_root:
  ci_nm_types:
  ci_nm_api:
  ci_nm_web:
