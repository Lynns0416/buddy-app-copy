services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: peacebuddy
      POSTGRES_PASSWORD: peacebuddy
      POSTGRES_DB: peacebuddy
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peacebuddy"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - apps/api/.env
    environment:
      DATABASE_URL: postgresql://peacebuddy:peacebuddy@db:5432/peacebuddy
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/packages/types/node_modules
      - /app/apps/api/node_modules

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - apps/web/.env.local
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      - api
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/apps/web/.next

  ci:
    profiles: [ci]
    build:
      context: .
      dockerfile: apps/api/Dockerfile  # reuse any image that has all deps
    environment:
      CI: "true"
    entrypoint: []
    command: sh -c "
      cd /app && pnpm install --frozen-lockfile &&
      pnpm exec prisma generate --schema /app/prisma/schema.prisma &&
      cd /app/packages/types && pnpm build &&
      cd /app/apps/api && pnpm lint && pnpm typecheck && pnpm test &&
      cd /app/apps/web && pnpm lint && pnpm typecheck && pnpm test
      "
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - ci_nm_root:/app/node_modules
      - ci_nm_types:/app/packages/types/node_modules
      - ci_nm_api:/app/apps/api/node_modules
      - ci_nm_web:/app/apps/web/node_modules

volumes:
  db_data:
  ci_nm_root:
  ci_nm_types:
  ci_nm_api:
  ci_nm_web:
