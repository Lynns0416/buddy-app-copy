name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    # Only the migration drift check touches this. Prisma replays
    # prisma/migrations/ into it and drops it again.
    services:
      shadow-db:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build types
        run: pnpm --filter @peace-buddy/types build

      - name: Generate Prisma client
        run: pnpm exec prisma generate --schema prisma/schema.prisma

      # Nothing else checks that prisma/migrations/ still produces
      # schema.prisma. Without this a schema edit with no migration passes CI,
      # and migrate deploy then builds a database the generated client
      # disagrees with — which surfaces at a query, not at boot.
      - name: Check migrations match schema
        env:
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          set +e
          pnpm exec prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code
          status=$?
          set -e
          case "$status" in
            0) echo "prisma/migrations/ matches schema.prisma" ;;
            2) echo "::error::prisma/migrations/ does not produce schema.prisma. Run 'prisma migrate dev --name <change>' and commit the migration." ; exit 1 ;;
            *) exit "$status" ;;
          esac

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (API)
        run: pnpm --filter @peace-buddy/api test:coverage

      - name: Coverage report
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: apps/api/coverage/coverage-summary.json
          name: API

      - name: Test (Web)
        run: pnpm --filter @peace-buddy/web test

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "${{ job.status == 'success' && '✅ CI Passed' || '❌ CI Failed' }}"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Repo*\n${{ github.repository }}" },
                    { "type": "mrkdwn", "text": "*Branch*\n`${{ github.ref_name }}`" },
                    { "type": "mrkdwn", "text": "*Triggered by*\n${{ github.actor }}" },
                    { "type": "mrkdwn", "text": "*Event*\n`${{ github.event_name }}`" }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ github.event.pull_request.title || github.event.head_commit.message }}"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*PR*\n<${{ github.event.pull_request.html_url || github.event.head_commit.url }}|${{ github.event.pull_request.title || 'View commit' }}>"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "View Run →" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }
