# Worktree Plus Configuration — https://github.com/satococoa/wtp
#
# A fresh worktree has no gitignored files, so Compose cannot start: the api and
# web services read apps/api/.env and apps/web/.env.local through env_file, and
# Next loads .env.local again at runtime. Copy them in on create.
#
# Copies, not symlinks: Compose resolves env_file on the host, where a link into
# the main worktree would work, but Next reads the file inside the container,
# where that path is not mounted. Re-run the copy by hand when a secret rotates.
#
# No dependency step — node_modules live in named Docker volumes, not in the
# worktree.
version: "1.0"

defaults:
  base_dir: ../worktrees

hooks:
  post_create:
    - type: copy
      from: apps/api/.env
      to: apps/api/.env
    - type: copy
      from: apps/web/.env.local
      to: apps/web/.env.local
    # Firebase emulator accounts are not copied: the firebase service fills an
    # empty .firebase/emulators from the tracked docker/firebase/seed.
    # Optional below: a copy whose source is missing fails the hook and skips
    # every later step, so anything a worktree needs to start stays above.
    # Only scripts/deploy.sh reads this. Drop it if you would rather not have
    # deploy credentials in every worktree.
    - type: copy
      from: deploy.env
      to: deploy.env
    # Read by scripts/azure-*.sh. They refuse a file anyone but the owner can
    # read; the copy keeps the source's mode, so leave the originals at 600.
    - type: copy
      from: scripts/azure.env
      to: scripts/azure.env
    - type: copy
      from: scripts/azure.stg.env
      to: scripts/azure.stg.env

